name: CineBite keep awake

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cinebite-keep-awake
  cancel-in-progress: false

jobs:
  health:
    # Forks must not keep pinging the production service.
    if: github.repository == 'anubhab0101/maharaja-cinebite'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake service and verify application health
        shell: bash
        run: |
          set -euo pipefail
          # A Render loading page can return HTTP 200; validate the JSON too.
          for attempt in 1 2 3; do
            if curl --silent --show-error --fail \
              --proto '=https' --connect-timeout 10 --max-time 45 \
              --header 'Cache-Control: no-cache' \
              "https://cinebite.store/health?probe=${GITHUB_RUN_ID}-${attempt}" \
              --output "$RUNNER_TEMP/cinebite-health.json" \
              && jq -e '.ok == true and .service == "cinebites"' \
                "$RUNNER_TEMP/cinebite-health.json" >/dev/null; then
              echo 'CineBite application and database are healthy.'
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo '::error::CineBite health check failed after three attempts.'
          exit 1
